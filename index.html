<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexflow Global | AI Sales Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 flex items-center justify-center min-h-screen p-4">
    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-hidden border border-gray-100">
        <div class="bg-blue-600 p-6 text-white text-center">
            <h1 class="text-xl font-bold tracking-tight">Nexflow AI</h1>
            <p class="text-xs opacity-80">Global Sales & Lead Manager</p>
        </div>
        
        <div id="chat" class="h-80 overflow-y-auto p-4 space-y-4 bg-gray-50 text-gray-800 text-sm">
            <div class="text-left"><span class="bg-gray-200 p-2 rounded-lg inline-block">Welcome! How can I assist your business today?</span></div>
        </div>

        <div class="p-4 bg-white border-t border-gray-100">
            <div class="flex gap-2">
                <input type="text" id="input" class="flex-1 bg-gray-100 border-none rounded-full px-4 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Ask about shipping or prices...">
                <button onclick="askAI()" class="bg-blue-600 text-white p-2 rounded-full hover:bg-blue-700 transition shadow-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
                    </svg>
                </button>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
