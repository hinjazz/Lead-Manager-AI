<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexflow AI Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-6">
    <div class="max-w-md mx-auto bg-white rounded-2xl shadow-xl p-6 border border-slate-200">
        <h1 class="text-xl font-bold text-blue-700 mb-2">Nexflow AI</h1>
        <p class="text-xs text-gray-500 mb-4">Mombasa Sales Assistant Demo</p>
        <div id="chat" class="h-64 overflow-y-auto mb-4 p-3 bg-slate-100 rounded-lg text-sm"></div>
        <input type="text" id="input" class="w-full border-2 border-slate-200 rounded-lg p-3 mb-3 focus:border-blue-500 outline-none" placeholder="Ask about AirPods...">
        <button onclick="askAI()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700 transition">Send Message</button>
    </div>
    <script src="app.js"></script>
</body>
</html>
